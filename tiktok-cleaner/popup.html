<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Cleaner</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>

<div class="container">

  <h1>TikTok Cleaner</h1>

  <p class="description">
    Remove your TikTok likes, reposts and favorites.
  </p>

  <div class="warning">
    ⚠️ These actions change your TikTok account.
    Only start an operation you actually want.
  </div>

  <button id="likes" class="action like">
    ❤️ Remove All Likes
  </button>

  <button id="reposts" class="action repost">
    🔄 Remove All Reposts
  </button>

  <button id="favorites" class="action favorite">
    ⭐ Remove All Favorites
  </button>

  <button id="stop" class="stop" disabled>
    ⛔ STOP
  </button>

  <div class="status">
    <span id="status">Ready</span>
  </div>

  <div class="counter">
    <span id="count">0</span>
    processed
  </div>

  <div class="progress">
    <div id="progress"></div>
  </div>

  <div id="details" class="details">
    Waiting...
  </div>

</div>

<script src="popup.js"></script>

</body>
</html>
