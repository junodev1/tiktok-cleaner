<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TikTok Cleaner</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <main>
    <h2>TikTok Cleaner</h2>

    <p class="info">
      Open your TikTok <b>Liked videos</b> page first.
    </p>

    <button id="start">Unlike Liked Videos</button>
    <button id="stop" disabled>Stop</button>

    <div class="status" id="status">
      Ready
    </div>

    <div class="counter" id="counter">
      0 processed
    </div>

    <div class="bar">
      <div id="bar"></div>
    </div>

    <p class="hint">
      The extension clicks TikTok's own Like button.
      It does not send private API requests.
    </p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
